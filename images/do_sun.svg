<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="doSunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="24" fill="url(#doSunBg)" />
  <!-- Animated Sun Rays -->
  <g transform="translate(100, 85)">
    <circle r="32" fill="url(#sunGrad)" />
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-38" />
      <line x1="0" y1="38" x2="0" y2="45" />
      <line x1="-45" y1="0" x2="-38" y2="0" />
      <line x1="38" y1="0" x2="45" y2="0" />
      <line x1="-32" y1="-32" x2="-26" y2="-26" />
      <line x1="26" y1="26" x2="32" y2="32" />
      <line x1="-32" y1="32" x2="-26" y2="26" />
      <line x1="26" y1="-26" x2="32" y2="-32" />
    </g>
  </g>
  <!-- Water Bottle / Hydration Icon -->
  <rect x="65" y="125" width="22" height="42" rx="5" fill="#0284c7" />
  <rect x="71" y="118" width="10" height="7" rx="2" fill="#0369a1" />
  <!-- Umbrella -->
  <path d="M 110,140 Q 130,120 150,140 Z" fill="#059669" />
  <path d="M 130,140 L 130,165 Q 130,170 125,170" stroke="#047857" stroke-width="3" fill="none" />
  <!-- Green Check Badge -->
  <circle cx="165" cy="35" r="20" fill="#059669" />
  <path d="M 155,35 L 162,42 L 175,28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
